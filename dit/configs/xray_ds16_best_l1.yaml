spatial_dims: 2
dit:
  params:
    input_size: [64, 64]
    patch_size: 4
    in_channels: 8
    hidden_size: 1152
    depth: 24
    num_heads: 16
    mlp_ratio: 4.0
    class_dropout_prob: 0.0
    num_classes: 0
    learn_sigma: false
    flash_attention: true
  scheduler:
    schedule: cosine
    num_train_timesteps: 300
    prediction_type: v_prediction
training:
  n_epochs: 1000
  eval_freq: 50
  batch_size: 2
  gradient_accumulation_steps: 2
  num_workers: 4
  roi_size: [1024, 1024]
  use_precomputed_latents: true
  preload_latents: false
  scale_factor: 1.0
  use_ema: true
  ema_decay: 0.9999
optim:
  lr: 1.0e-4
  lr_gamma: 0.999
